<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Página no encontrada — Oscar Ordoñez</title>
<meta name="robots" content="noindex">
<script>try { var t = localStorage.getItem('oo-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="icon" href="/Portafolio/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/Portafolio/assets/css/styles.css">
<style>
  .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  .lost h1 { font-size: clamp(3.4rem, 12vw, 7rem); letter-spacing: -.05em; }
  .lost h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lost p { margin: 16px auto 32px; max-width: 46ch; color: var(--text-soft); }
  .lost canvas { width: min(360px, 80vw); height: 220px; margin: 0 auto 8px; }
</style>
</head>
<body>
  <main class="lost">
    <div>
      <canvas data-voxel="world" data-seed="404" aria-hidden="true"></canvas>
      <h1><span>404</span></h1>
      <p>Este chunk no cargó. La página que buscas no existe en este mundo.</p>
      <a class="btn btn-primary" href="./">Volver al inicio</a>
    </div>
  </main>
  <script src="/Portafolio/assets/js/voxel.js" defer></script>
</body>
</html>
