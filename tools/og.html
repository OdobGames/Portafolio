<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:#07080c;color:#e9edf4;
       font-family:'Liberation Sans','DejaVu Sans',system-ui,sans-serif;position:relative}
  .glow{position:absolute;inset:-30% -10% auto -20%;height:820px;
        background:radial-gradient(52% 48% at 25% 18%,rgba(124,92,255,.36),transparent 62%),
                   radial-gradient(46% 44% at 86% 30%,rgba(53,214,193,.24),transparent 64%)}
  .lattice{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:radial-gradient(75% 70% at 40% 40%,#000,transparent 80%)}
  .wrap{position:relative;display:flex;height:100%;align-items:center;padding:0 62px;gap:26px}
  .left{flex:1.15;min-width:0}
  .mark{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .mark svg{width:38px;height:38px}
  .mark b{font-size:19px;font-weight:700;letter-spacing:-.2px}
  .mark span{font-size:19px;color:#7b8698}
  h1{font-size:62px;line-height:1.04;letter-spacing:-2.4px;font-weight:700}
  h1 i{font-style:normal;background:linear-gradient(120deg,#8f74ff,#35d6c1);
       -webkit-background-clip:text;color:transparent}
  p.role{margin-top:22px;font-size:22px;color:#aab4c4;line-height:1.45;max-width:30ch}
  .chips{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
  .chip{padding:8px 15px;border:1px solid rgba(255,255,255,.16);border-radius:999px;
        font-size:15px;color:#cfd6e2;background:rgba(255,255,255,.04)}
  .chip.live{border-color:rgba(53,214,193,.45);color:#35d6c1;background:rgba(53,214,193,.08)}
  .right{flex:1;display:flex;align-items:center;justify-content:center}
  canvas{width:460px;height:460px}
  .url{position:absolute;left:62px;bottom:38px;font-family:'DejaVu Sans Mono',monospace;
       font-size:16px;color:#6b7688;letter-spacing:.4px}
</style></head><body>
<div class="glow"></div><div class="lattice"></div>
<div class="wrap">
  <div class="left">
    <div class="mark">
      <svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8f74ff"/><stop offset="1" stop-color="#35d6c1"/></linearGradient></defs>
        <path d="M16 3 29 10.5 16 18 3 10.5Z" fill="url(#g)"/>
        <path d="M3 10.5 16 18v11L3 21.5Z" fill="#4a3aa8"/>
        <path d="M29 10.5 16 18v11l13-7.5Z" fill="#1f8f83"/></svg>
      <b>Oscar Ordoñez</b><span>/ OdobGames</span>
    </div>
    <h1>Sistemas <i>en tiempo real</i> en el navegador</h1>
    <p class="role">Ingeniero de software · Ciencias de la Computación, UNAL</p>
    <div class="chips">
      <span class="chip live">WebCraft — Minecraft web</span>
      <span class="chip live">Carritos — karts online</span>
      <span class="chip">3 juegos en Google Play</span>
    </div>
  </div>
  <div class="right"><canvas data-voxel="world" data-seed="1043"></canvas></div>
</div>
<div class="url">odobgames.github.io/Pruebaclaude</div>
<script src="../assets/js/voxel.js"></script>
</body></html>
