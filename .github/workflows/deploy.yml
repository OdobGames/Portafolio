name: Deploy to GitHub Pages

# One-time setup, required once per repository and not grantable from here:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# The workflow token can publish to Pages but is not allowed to create the Pages
# site itself ("Resource not accessible by integration"), so that switch has to
# be flipped by hand the first time. After that, every push deploys.

on:
  push:
    branches:
      - main
      - claude/portfolio-webpage-github-pages-8uxd9k
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
